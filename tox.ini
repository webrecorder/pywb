[pytest]
#addopts = --cov pywb -vv --doctest-modules pywb --cov-report=xml --cov-report=term
testpaths =
    tests

[tox]
envlist = py39, py310, py311, py312, py313, py314

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv = PYWB_NO_VERIFY_SSL = 1
passenv = *
deps =
    setuptools
    -rtest_requirements.txt
    -rrequirements.txt
    -rextra_requirements.txt
# httpbin pins greenlet<3.0 on Python < 3.12, which holds these versions back
# to gevent 24.2.1 + greenlet 2.0.2. On 3.9 that pair intermittently loses a
# greenlet wakeup and hangs the tests, so upgrade them after httpbin is installed.
commands_pre =
    py39,py310,py311: python -m pip install -U "gevent>=25" "greenlet>=3.1"
commands =
    pytest --cov-config .coveragerc --cov pywb -v --doctest-modules ./pywb/ tests/


