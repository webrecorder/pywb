[uwsgi]
if-not-env = PORT
http-socket = :8080
socket = :8081
endif =

master = true
buffer-size = 65536
die-on-term = true

if-env = VIRTUAL_ENV
venv = $(VIRTUAL_ENV)
endif =

gevent = 100

# cache the index lookups, shared by all processes
# see "Index Cache (uWSGI)" in the docs
#cache2 = name=pywb-index,items=20000,keysize=64,blocksize=4096,blocks=32768,bitmap=1,purge_lru=1,ignore_full=1

#Not available until uwsgi 2.1
#monkey-patching manually in pywb.apps.wayback
#gevent-early-monkey-patch =
# for uwsgi<2.1, set env when using gevent
env = GEVENT_MONKEY_PATCH=1

# specify config file here
env = PYWB_CONFIG_FILE=config.yaml

if-not-env = UWSGI_MOUNT
wsgi = pywb.apps.wayback
endif =

# Set the path to which pywb should be mounted
if-env = UWSGI_MOUNT
mount = %(_)
manage-script-name = true
endif =
