[uwsgi]
if-not-env = PORT
http-socket = :8080
socket = :8081
endif =

master = true
buffer-size = 65536
die-on-term = true

if-env = VIRTUAL_ENV
venv = $(VIRTUAL_ENV)
endif =

gevent = 100

# cache the paths found in a path index (archive_paths), shared by all processes
# see "Path Index Configuration" in the docs
#cache2 = name=pywb-pathindex,items=50000,keysize=64,blocksize=512,bitmap=1,purge_lru=1,ignore_full=1

#Not available until uwsgi 2.1
#monkey-patching manually in pywb.apps.wayback
#gevent-early-monkey-patch =
# for uwsgi<2.1, set env when using gevent
env = GEVENT_MONKEY_PATCH=1

# specify config file here
env = PYWB_CONFIG_FILE=config.yaml

if-not-env = UWSGI_MOUNT
wsgi = pywb.apps.wayback
endif =

# Set the path to which pywb should be mounted
if-env = UWSGI_MOUNT
mount = %(_)
manage-script-name = true
endif =
