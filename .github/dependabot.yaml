version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7
- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7
